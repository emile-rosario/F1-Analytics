# Actualizaciones de dependencias: una vez por semana, agrupadas para no llenar el repositorio de
# PR. Las versiones menores y de parche van juntas en un solo PR por ecosistema; las mayores
# (que pueden romper algo) llegan cada una en su propio PR. Emile revisa y mergea, como siempre.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
    groups:
      menores-y-parches:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
    groups:
      menores-y-parches:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
    groups:
      menores-y-parches:
        update-types: [minor, patch]
