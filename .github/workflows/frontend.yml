name: Frontend

on:
  pull_request:
  push:
    branches: [main]

jobs:
  calidad:
    name: Lint, tests y build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Comprobar que los tipos de la API están al día
        run: |
          npm run tipos
          git diff --exit-code -- src/lib/tipos-api.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Instalar Chromium (Linux)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Instalar Chromium (Windows)
        if: runner.os == 'Windows'
        run: npx playwright install chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ matrix.os }}
          path: frontend/test-results
          retention-days: 7
